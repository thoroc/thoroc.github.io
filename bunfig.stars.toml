[test]
# Scoped to `bun test --config=bunfig.stars.toml src/stars` — kept out of the
# root bunfig.toml (which doesn't exist) so the site's existing
# .agents/scripts and .agents/hooks tests are unaffected by DOM globals or a
# per-file coverage gate that doesn't apply to them.
preload = ["./test-support/dom-setup.ts", "./test-support/vue-loader.ts"]
coverage = true
coverageThreshold = { lines = 0.9, functions = 0.9 }

# WebGL/canvas call sites cannot be meaningfully exercised without a real GPU
# context — a headless test DOM has no WebGL implementation. Excluded here,
# explicitly, rather than silently landing under the coverage target.
# See .context/plans/2026-08-17-stars-typescript-conversion.md.
#
# test-support/** is test infrastructure (the SFC loader, DOM setup, the
# regression-oracle fixtures/script), not application code under
# conversion — it's exempt from the src/stars/ coverage target for the same
# reason .agents/scripts tooling isn't held to it either.
#
# The coverage gate is enforced per file, including files only touched
# transitively (e.g. gas-buffers/ imports morphological-layout.js, which
# re-exports galaxy-field.js). The entries below are still-untyped legacy
# Wave A/B modules pending their own Phase 2 conversion; excluding them here
# is temporary scaffolding so an already-converted module's own test run
# isn't blocked by someone else's not-yet-converted dependency. Remove an
# entry once that file gets its own conversion and colocated tests.
# buildGasClumpField.ts has one branch (`if (!clumps.length)`) that is
# provably unreachable, not merely hard to exercise: clumpCount is always
# `3 + Math.floor(hashUnit(...) * 4)`, and hashUnit's range is [0, 1), so
# clumpCount is always in {3,4,5,6} and the preceding loop always pushes at
# least 3 clumps. Left in place unmodified (this is a conversion, not a
# cleanup pass) but excluded here rather than silently landing under the
# coverage target with an uncoverable branch.
#
# virtual-stars/nebulaSampleRadius.ts has the same class of issue: its
# `u < coreRatio` check uses the module-local `hashUnitLocal(h, 10)` (a
# distinct, ported-as-is formula — NOT the canonical ../hash hashUnit), whose
# `((h >>> 10) & 0xfffffff) / 0xfffffff` shape caps the result at 2^22/2^28 =
# 0.015625 for any 32-bit h. MORPHOLOGY_LAYOUT.NEBULA_CORE_RATIO is a fixed
# 0.22, so `u < coreRatio` is always true and the halo/outer-radius branch is
# unreachable. Left in place unmodified, excluded here for the same reason.
#
# useStarsStore/resetStateForTests.ts is inline test infrastructure (colocated
# with the module it resets rather than living under test-support/, since it
# reaches into every one of the module's private refs/box-objects) — never
# imported by production code or re-exported from the barrel, exempt for the
# same reason test-support/** is.
#
# useStarsStore/state.ts holds two inline no-op function *values*
# (scrollController.fn, rowRemeasureController.fn) as lazy defaults. Because
# the module's state is a shared singleton (by design — see the Phase 1
# mutable-box-object pattern) and every test file that overrides `.fn` resets
# it via resetStateForTests' own `() => undefined` (a different source line),
# whichever sibling test file happens to run first permanently replaces
# state.ts's original default closure for the rest of the suite — hitting
# state.ts's exact original line is not reliably achievable regardless of
# test order. The behavior itself (never throws) is still covered by
# state.test.ts; only the specific-source-line function-coverage metric is
# excluded here.
coveragePathIgnorePatterns = [
  "src/stars/galaxy/webgl.ts",
  "test-support/**",
  "src/stars/galaxy/gas-clump-field/buildGasClumpField.ts",
  "src/stars/galaxy/virtual-stars/nebulaSampleRadius.ts",
  "src/stars/composables/useStarsStore/resetStateForTests.ts",
  "src/stars/composables/useStarsStore/state.ts",
]
