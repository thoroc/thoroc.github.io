name: aislop

# Blocking code-quality gate (aislop) enforced in CI, where the local hooks
# are bypassable (--no-verify, web-UI merges, API commits). Runs the same
# mise-pinned aislop (0.14.1 in mise.toml) as the pre-commit hook. Scoped to
# the PR's changed files vs the base branch on a pull request; whole repo on
# push to main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede an in-flight run when the ref updates (e.g. a rebase), so stale
  # runs are cancelled instead of piling up.
  group: aislop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the diff against the base branch works.
          fetch-depth: 0
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          # Authenticate mise's GitHub releases API calls so tool installs are
          # not capped at the 60 req/hr unauthenticated rate limit.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # The gate type-checks, so the project dependencies must be present.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # aislop's tsc needs the astro-generated content types (tsconfig includes
      # .astro/types.d.ts), which only exist after astro sync in a fresh checkout.
      - name: Generate astro types
        run: bun run astro sync
      - name: aislop quality gate (changed files vs base)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          aislop ci --changes --base "origin/$BASE_REF"
      - name: aislop quality gate (whole repo)
        if: github.event_name != 'pull_request'
        run: aislop ci .
