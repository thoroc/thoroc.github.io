[tools]
bun = "1.3.14"
node = "24.19.0"
hk = "1.54.0"
actionlint = "1.7.12"
biome = "2.5.6"

[env]
HK_MISE = "1"

[hooks]
enter = "mise install"
postinstall = "hk install --mise"

[tasks.dev]
description = "Run the Astro dev server"
run = "bun run dev"

[tasks.build]
description = "Build the site for production"
run = "bun run build"

[tasks.preview]
description = "Preview the production build"
run = "bun run preview"

[tasks.typecheck]
description = "Type check with astro check"
run = "bun run typecheck"

[tasks.test]
description = "Run unit tests"
run = "bun test"

[tasks.lint]
description = "Check formatting and linting with biome and actionlint"
run = ["biome check .", "actionlint"]

[tasks.fix]
description = "Fix formatting and linting with biome"
run = "biome check --write ."
