[tools]
bun = "1.3.14"
node = "24.19.0"
hk = "1.54.0"
actionlint = "1.7.12"
biome = "2.5.6"
markdownlint-cli2 = "0.23.2"
shellcheck = "0.11.0"
"npm:aislop" = "0.14.1"
"npm:ctxharness" = "0.4.6"
"npm:sigmap" = "8.24.0"

[env]
HK_MISE = "1"

[settings]
minimum_release_age = "7d"

[hooks]
enter = "mise install"
postinstall = "hk install --mise"

[tasks.dev]
description = "Run the Astro dev server"
run = "bun run dev"

[tasks.build]
description = "Build the site for production"
run = "bun run build"

[tasks.preview]
description = "Preview the production build"
run = "bun run preview"

[tasks.typecheck]
description = "Type check with astro check"
run = "bun run typecheck"

[tasks.test]
description = "Run unit tests"
run = "bun test"

[tasks.lint]
description = "Check formatting and linting with biome and actionlint"
run = ["biome check .", "actionlint"]

[tasks.fix]
description = "Fix formatting and linting with biome"
run = "biome check --write ."

[tasks.aislop]
description = "Scan the repo for AI slop and quality regressions"
run = "aislop scan"

[tasks.ctx]
description = "Check AI instruction files (AGENTS.md/CLAUDE.md) for drift"
run = "ctxharness run --no-trend"

[tasks.sigmap]
description = "Regenerate the SigMap deterministic context map"
run = "sigmap gen-context"
